name: CI/CD Pipeline - Back Ventas

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./Springboot-API-REST
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/back-ventas:latest

      - name: Despliegue en EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PROXY: ${{ secrets.EC2_PROXY_HOST }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DB_ENDPOINT: ${{ secrets.DB_ENDPOINT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "$SSH_KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          ssh -i /tmp/ssh_key \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no -W %h:%p ${EC2_USER}@${EC2_PROXY}" \
            ${EC2_USER}@${EC2_HOST} "
            docker pull ${DOCKER_USER}/back-ventas:latest || true
            docker stop back-ventas || true
            docker rm back-ventas || true
            docker run -d \
              --name back-ventas \
              -p 8080:8080 \
              -e DB_ENDPOINT=${DB_ENDPOINT} \
              -e DB_PORT=3306 \
              -e DB_NAME=ventas_db \
              -e DB_USERNAME=${DB_USERNAME} \
              -e DB_PASSWORD=${DB_PASSWORD} \
              ${DOCKER_USER}/back-ventas:latest
          "
